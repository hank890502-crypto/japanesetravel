name: JapanTravelAssistant
options:
  bundleIdPrefix: com.linzihao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.29.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  JapanTravelAssistant:
    type: application
    platform: iOS
    sources:
      - path: JapanTravelAssistant
        excludes:
          - "Info.plist"
          - "**/README.md"
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: JapanTravelAssistant/Info.plist
      properties:
        CFBundleDisplayName: 日本旅遊助手
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 需要使用相機來拍攝菜單、商品和價牌。
        NSPhotoLibraryUsageDescription: 需要讀取相簿，讓你選擇菜單或商品的照片。
        NSLocationWhenInUseUsageDescription: 用來讓「找地點」的結果優先顯示你附近的地方。不會記錄你的位置。
        LSApplicationQueriesSchemes: [comgooglemaps, yjcarnavi, chatgpt]
        CFBundleURLTypes:
          - CFBundleURLName: com.linzihao.japantravelassistant
            CFBundleURLSchemes: [jptravel]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        WEB_GUEST_URL: $(WEB_GUEST_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linzihao.japantravelassistant
        PRODUCT_NAME: JapanTravelAssistant
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - JapanTravelAssistantTests
  JapanTravelAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JapanTravelAssistantTests
    dependencies:
      - target: JapanTravelAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linzihao.japantravelassistant.tests
        GENERATE_INFOPLIST_FILE: YES
