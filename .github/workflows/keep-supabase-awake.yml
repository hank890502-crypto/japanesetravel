name: Keep Supabase awake
on:
  schedule:
    - cron: "17 1 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/guest/config.js
          sparse-checkout-cone-mode: false
      - name: ping
        run: |
          URL=$(grep -o 'supabaseUrl: *"[^"]*"' web/guest/config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' web/guest/config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config not found"; exit 1; fi
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' -m 30 "$URL/rest/v1/dining_rooms?select=id&limit=1" -H "apikey: $KEY" || echo 000)
            echo "try $i: HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase unreachable, open supabase.com and press Restore."
          exit 1
