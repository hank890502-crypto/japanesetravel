# 把 web/guest 部署到 GitHub Pages。每次 push 到 main 都會自動更新。
# 第一次要先到 repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」（見 web/README.md），
# 預設的 GITHUB_TOKEN 沒有權限自動開啟 Pages。
name: Deploy Web Guest to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/guest/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/guest
      - id: deployment
        uses: actions/deploy-pages@v4
